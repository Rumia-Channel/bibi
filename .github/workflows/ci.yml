name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on master (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Verify release tag
        id: release
        if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag must match package.json version (v$VERSION)"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Release tag must reference a commit included in master"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun audit
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - name: Build release ZIP
        id: archive
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          bun run archive
          ZIP=(__archives/Bibi_*/"Bibi-$RELEASE_TAG.zip")
          if [[ ${#ZIP[@]} != 1 || ! -f "${ZIP[0]}" ]]; then
            echo "::error::Expected exactly one Bibi-$RELEASE_TAG.zip archive"
            exit 1
          fi
          echo "zip=${ZIP[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload release ZIP
        if: steps.release.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: ${{ steps.archive.outputs.zip }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: ci
    if: needs.ci.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.ci.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.ci.outputs.release_tag }}
          PRERELEASE: ${{ needs.ci.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "Bibi $RELEASE_TAG" --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" "release/Bibi-$RELEASE_TAG.zip" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
