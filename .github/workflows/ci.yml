name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun audit
        continue-on-error: true # known remaining: uuid@8 via dev-server sockjs (dev-only, see README How to Verify)
      - run: bun run build
